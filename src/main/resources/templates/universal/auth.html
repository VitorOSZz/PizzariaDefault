<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Autenticação</title>

    <link rel="stylesheet" th:href="@{/universal/styles/auth.css}">
</head>

<body>

    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <div class="brand-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 id="login-title">Login</h1>
                <p class="subtitle">Acesse sua conta para continuar</p>
            </header>

            <div id="form-feedback" class="feedback-message" aria-live="polite" hidden></div>

            <form th:action="@{/login}" method="post" class="login-form" id="login-form" novalidate>
                <div class="field">
                    <label for="username">Email</label>
                    <div class="input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="email" id="username" name="username" placeholder="voce@exemplo.com" autocomplete="username" required />
                    </div>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <div class="input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required />
                        <button type="button" class="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
                            <svg class="icon icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.88 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A18.45 18.45 0 0 0 1 12s4 8 11 8a10.07 10.07 0 0 0 5.94-1.94"></path>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="2" y1="2" x2="22" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember-me" value="true" />
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="/forgot-password" class="forgot">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-spinner" aria-hidden="true" hidden></span>
                </button>
            </form>
        </section>

    </main>

    <script th:src="@{/universal/scripts/auth.js}" defer></script>
</body>

</html>
