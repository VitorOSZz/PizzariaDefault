<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/styles/root.css}">
    <link rel="stylesheet" th:href="@{/styles/style.css}">
    <link rel="stylesheet" th:href="@{/styles/products.css}">
    <link rel="stylesheet" th:href="@{/styles/admin-dialogs.css}">
    <link rel="stylesheet" th:href="@{/styles/media-queries.css}">
    <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>

<body>
    <header>
        <div id="title">
            <div>
                <h1>Pizzaria Admin</h1>
                <p>Gerenciador de cardapio</p>
            </div>
        </div>
        <p class="which_page">PRODUTOS</p>
    </header>
    <div id="aside-and-content">
        <aside>
            <h2>Menu</h2>
            <nav><button type="button" id="products-page-button" class="active">Produtos</button><button type="button" id="settings-page-button">Configuracoes</button></nav>
        </aside>
        <main>
            <div id="main-header">
                <div>
                    <h2 class="which_page">Produtos</h2>
                    <h3>0 produtos cadastrados</h3>
                </div>
                <div id="add-product"><button type="button" onclick="edit_product()">Adicionar Produto</button></div>
            </div>
            <div id="table-and-nav">
                <nav><button type="button" id="everyting-btn" class="border-bottom-active">Todos</button><button type="button" id="pizzas-btn">Pizzas</button><button type="button" id="calzones-btn">Calzones</button><button type="button" id="drinks-btn">Bebidas</button></nav>
                <section id="products">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="products-list"></tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>
    <dialog id="product">
        <div id="product_header">
            <div>
                <h1>Adicionar produto</h1><button commandfor="product" command="close" type="button" aria-label="Fechar">X</button>
            </div>
            <p>Preencha os dados do novo produto</p>
        </div>
        <div id="product_body">
            <form action="">
                <fieldset id="product_type">
                    <legend>Tipo de produto</legend>
                    <div><input type="radio" id="pizza" name="type" value="pizza" checked><label for="pizza">Pizza</label><input type="radio" id="drink" name="type" value="drink"><label for="drink">Bebida</label><input type="radio" id="calzone" name="type" value="calzone"><label for="calzone">Calzone</label></div>
                </fieldset>
                <div id="product_description">
                    <div id="product_name"><label for="name">Nome <span>*</span></label><input type="text" name="name" id="name" placeholder="Pizza de Calabresa" required></div>
                    <div id="product_desc"><label for="desc">Descrição</label><input type="text" name="desc" id="desc" placeholder="Calabresa, queijo parmesão, presunto"></div>
                    <div id="product_image"><label for="image_url">Imagem</label>
                        <div>
                            <div id="image-preview"><span>Prévia</span><img id="preview-image" alt="Prévia do produto"></div>
                            <div id="image_text"><input type="file" name="image_file" id="image_file"><label for="image_file">Imagem do seu computador</label><input type="text" name="image_url" id="image_url" placeholder="Imagem por url da web"></div>
                        </div>
                    </div>
                    <fieldset id="product_status">
                        <legend>Status</legend>
                        <div><input type="radio" id="status_active" name="status" value="active" checked><label for="status_active">Ativo</label><input type="radio" id="status_inactive" name="status" value="inactive"><label for="status_inactive">Inativo</label></div>
                    </fieldset>
                    <div><label for="size-prices">Tamanhos e preços</label>
                        <p>Ative os tamanhos disponíveis e defina o preço de cada um.</p>
                    </div>
                    <div id="size-prices" aria-label="Tamanhos e preços"></div><button type="submit" id="save-product">Adicionar produto</button>
                </div>
            </form>
        </div>
    </dialog>
    <script th:src="@{/scripts/admin/product.js}"></script>
    <script th:src="@{/scripts/admin/settings.js}"></script>
    <script th:src="@{/scripts/admin/admin-navigation.js}"></script>
</body>

</html>
