spring.application.name=PizzariaDefault

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

image.storage.base-url=${IMAGE_STORAGE_BASE_URL:https://kapfjzbgdoupteotrxkj.supabase.co/storage/v1/object/public/static}

app.security.login-redirect-url=${APP_LOGIN_REDIRECT_URL:/pizzaria-default/admin}
